name: Deploy

# When to run: every push to main, plus a manual "Run workflow" button.
on:
  push:
    branches: [main]
    # Don't rebuild the image for changes that aren't part of it.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "infra/**"
      - "web/**"
  workflow_dispatch:

# id-token: write lets the job ask GitHub for an OIDC login token.
permissions:
  id-token: write
  contents: read

# Never run two deploys at the same time.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: supply-chain-radar
  ECS_CLUSTER: radar

jobs:
  test:
    runs-on: ubuntu-24.04-arm

    # A real Postgres for the tests, like docker-compose's "db".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: radar
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/radar
      DB_USER: radar
      DB_PASSWORD: radar_local_only

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run the tests
        run: ./gradlew build --no-daemon

  deploy:
    needs: test
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to AWS (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build --provenance=false -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

      - name: Roll the ECS services onto the new image
        run: |
          for svc in radar-api radar-scorer radar-collector; do
            aws ecs update-service --cluster "$ECS_CLUSTER" --service "$svc" --force-new-deployment > /dev/null
          done
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services radar-api radar-scorer radar-collector