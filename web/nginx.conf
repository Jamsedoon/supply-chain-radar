server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Send API calls to the Java app.
    # "app" is the Java container's name in docker-compose.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    # Everything else: serve the dashboard files.
    location / {
        try_files $uri /index.html;
    }
}