# Fellegi-Sunter parameters for the name matching engine.
#
# For every comparator and level:
#   m = how often this comparator agrees when the pair IS a typosquat
#   u = how often it agrees when the pair is unrelated
#
# Evidence contributed = log2(m / u). A big gap means a strong clue.
#
# These are informed starting estimates, tuned by hand against the truth set
# in SC-05c. SC-31 replaces them with values computed from labelled data.

# ---------------------------------------------------------------------------
# Bucket boundaries: a raw score at or above these falls into that level.
# ---------------------------------------------------------------------------
level.strong = 0.85
level.weak   = 0.65

# ---------------------------------------------------------------------------
# Total evidence needed to raise an alert, in bits.
# ---------------------------------------------------------------------------
threshold = 9.0

# ---------------------------------------------------------------------------
# edit_distance - the plain mistyped name.
# Common in real squats, but similar names also occur innocently
# (react / react-dom), so u is not tiny.
# ---------------------------------------------------------------------------
edit_distance.STRONG.m = 0.70
edit_distance.STRONG.u = 0.0010
edit_distance.WEAK.m   = 0.20
edit_distance.WEAK.u   = 0.0300

# ---------------------------------------------------------------------------
# jaro_winkler - similarity weighted toward a shared prefix.
# Fires often for real squats, but also for legitimate sibling packages
# that share a prefix, which is why WEAK carries almost no weight.
# ---------------------------------------------------------------------------
jaro_winkler.STRONG.m = 0.80
jaro_winkler.STRONG.u = 0.0050
jaro_winkler.WEAK.m   = 0.15
jaro_winkler.WEAK.u   = 0.0800

# ---------------------------------------------------------------------------
# keyboard_adjacency - a physically plausible typing slip.
# Fires for less than half of squats, but almost never by chance.
# Low m, very low u: the strongest single clue available.
# ---------------------------------------------------------------------------
keyboard_adjacency.STRONG.m = 0.45
keyboard_adjacency.STRONG.u = 0.0002
keyboard_adjacency.WEAK.m   = 0.10
keyboard_adjacency.WEAK.u   = 0.0020

# ---------------------------------------------------------------------------
# homoglyph - visually identical, textually different.
# All-or-nothing, so WEAK never fires and is set to contribute nothing.
# ---------------------------------------------------------------------------
homoglyph.STRONG.m = 0.10
homoglyph.STRONG.u = 0.00005
homoglyph.WEAK.m   = 0.0
homoglyph.WEAK.u   = 0.0

# ---------------------------------------------------------------------------
# delimiter - same word, different punctuation. Also all-or-nothing.
# ---------------------------------------------------------------------------
delimiter.STRONG.m = 0.15
delimiter.STRONG.u = 0.00010
delimiter.WEAK.m   = 0.0
delimiter.WEAK.u   = 0.0

# ---------------------------------------------------------------------------
# family_prefix - one name is the other plus a suffix.
#
# The only clue with a negative weight. Extending a popular name is the npm
# convention for official companion packages (react-dom, webpack-cli), so it
# fires far more often for legitimate pairs than for squats. log2(m/u) is
# therefore negative: this clue argues AGAINST a match.
#
# Added in SC-05c. Measurement showed jaro_winkler and edit_distance produced
# identical evidence (10.06 bits) for momnet/moment, a real squat, and
# webpack-cli/webpack, a legitimate companion. No reweighting separates cases
# that generate the same evidence; a clue that distinguishes them does.
# ---------------------------------------------------------------------------
family_prefix.STRONG.m = 0.05
family_prefix.STRONG.u = 0.60
family_prefix.WEAK.m   = 0.0
family_prefix.WEAK.u   = 0.0