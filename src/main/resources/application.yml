radar:
  role: ${APP_ROLE:api}
  queue:
    type: ${QUEUE_TYPE:memory}
  collector:
    batch-size: ${COLLECTOR_BATCH_SIZE:20}
    interval-ms: ${COLLECTOR_INTERVAL_MS:60000}
    initial-delay-ms: ${COLLECTOR_INITIAL_DELAY_MS:5000}
  

spring:
  application:
    name: supply-chain-radar

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/radar}
    username: ${DB_USER:radar}
    password: ${DB_PASSWORD:radar_local_only}

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.zisti.radar: INFO