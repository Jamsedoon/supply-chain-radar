services:
  db:
    image: postgres:16-alpine
    container_name: radar-db
    environment:
      POSTGRES_DB: radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar_local_only
    ports:
      - "5432:5432"
    volumes:
      - radar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d radar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  radar-db-data: